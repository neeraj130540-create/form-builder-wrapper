name: Fx Package Build

on:
  push:
    branches:
      - main

jobs:
  build-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com/

      # Show current directory for debugging
      - run: pwd && ls -a

      # 🧩 Replace token placeholder with GitHub secret
      - name: Inject third-party token
        env:
          THIRD_PARTY_TOKEN: ${{ secrets.THIRD_PARTY_TOKEN }}
        run: |
          echo "Injecting third-party token into .npmrc..."
          sed -i "s|\${THIRD_PARTY_TOKEN}|$THIRD_PARTY_TOKEN|g" .npmrc
          echo ".npmrc after injection:"
          cat .npmrc

      # 🧠 Install dependencies (will now authenticate properly)
      - name: Install dependencies
        run: npm install --force

      # 🏗️ Build your Angular library
      - run: ng build fx-builder-wrapper

      # 🚀 Publish to GitHub Packages
      - name: Publish package
        run: cd dist/instantsys-labs/fx && npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
