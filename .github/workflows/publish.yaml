name: Fx Package Build

on:
  push:
    branches:
      - main

jobs:
  build-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      # ✅ Step 1: Checkout repository
      - uses: actions/checkout@v4

      # ✅ Step 2: Setup Node.js and registry
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com/

      # ✅ Step 3: Inject .npmrc dynamically with secret (for third-party access)
      - name: Configure npm authentication
        run: |
          echo "@instantsys-labs:registry=https://npm.pkg.github.com" > ~/.npmrc
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.THIRD_PARTY_TOKEN }}" >> ~/.npmrc

      # ✅ Step 4: Verify token works (safe)
      - name: Verify npm authentication
        run: npm whoami --registry=https://npm.pkg.github.com/
        env:
          NODE_AUTH_TOKEN: ${{ secrets.THIRD_PARTY_TOKEN }}

      # ✅ Step 5: Install dependencies
      - name: Install dependencies
        run: npm install --force

      # ✅ Step 6: Install Angular CLI (needed for ng build)
      - name: Install Angular CLI
        run: npm install -g @angular/cli

      # ✅ Step 7: Build the Angular library
      - name: Build library
        run: ng build fx-builder-wrapper

      # ✅ Step 8: Configure npmrc for publishing to your own repo
      - name: Configure GitHub npm authentication
        run: |
          echo "@neeraj130540-create:registry=https://npm.pkg.github.com" > ~/.npmrc
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" >> ~/.npmrc

      # ✅ Step 9: Publish the built package
      - name: Publish package
        run: cd dist/fx-builder-wrapper && npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
