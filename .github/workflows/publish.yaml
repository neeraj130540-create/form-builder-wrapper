name: Fx Package Build

on:
  push:
    branches:
      - main

jobs:
  build-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com/

      # ✅ Inject token into BOTH home and workspace .npmrc
      - name: Configure npm authentication
        run: |
          echo "@instantsys-labs:registry=https://npm.pkg.github.com" > ~/.npmrc
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.THIRD_PARTY_TOKEN }}" >> ~/.npmrc
          cp ~/.npmrc .npmrc   # ✅ ADD THIS LINE (THE FIX)

      # ✅ Debug check (safe)
      - name: Verify npm auth
        run: npm whoami --registry=https://npm.pkg.github.com/
        env:
          NODE_AUTH_TOKEN: ${{ secrets.THIRD_PARTY_TOKEN }}

      # ✅ Install dependencies (now .npmrc is picked)
      - name: Install dependencies
        run: npm install --force

      # ✅ Install Angular CLI globally
      - name: Install Angular CLI
        run: npm install -g @angular/cli
        
      # ✅ Build library
      - name: Build library
        run: ng build fx-builder-wrapper

      # ✅ Publish built package
      - name: Publish package
        run: cd dist/fx-builder-wrapper && npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
